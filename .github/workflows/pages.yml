# Publishes the static game to GitHub Pages on every push to main.
#
# No pip install step: build_static.py and build_site.py import only the
# stdlib plus this repo's pure-Python modules (app.config, epw_ingest.catalog,
# epw_ingest.koppen). The heavy build — ladybug/plotly turning EPW files into
# chart JSON — happens locally via `make build`, and its output is committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you redeploy from the Actions tab by hand

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split the manifest into index + per-location answers
        run: python -m epw_ingest.build_static
      - name: Assemble _site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
